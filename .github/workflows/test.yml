name: Test Action

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout action repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -t . -v

      - name: Verify embedded template payloads are fresh
        run: python3 scripts/render_gitlab_template.py --check

      - name: Check shell syntax
        run: bash -n entrypoint.sh

  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout action repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Show CLI version
        id: test-version
        uses: ./
        with:
          command: --version

      - name: Show CLI help
        id: test-help
        uses: ./
        with:
          command: --help

      - name: Verify outputs
        run: |
          echo "Version test exit code: ${{ steps.test-version.outputs.exit-code }}"
          echo "Help test exit code:    ${{ steps.test-help.outputs.exit-code }}"
