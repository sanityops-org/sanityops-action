# ==============================================================================
# SanityOps Defect Inspection - GitLab CI shared pipeline template
#
# Usage (add to the consuming project's .gitlab-ci.yml):
#
#   include:
#     - project: 'sanityops-org/sanityops-action'
#       ref: 'v1'                             # or a pinned tag such as 'v1.0.0'
#       file: '/templates/inspect.gitlab-ci.yml'
#
# The LLM credentials and artifact list come from the project's own
# .sanityops/inspect_config.yaml, read automatically at run time.
#
# Note: .sanityops/.gitignore (written by `sanityops-cli init`) ignores every file
# in that directory. Add `!inspect_config.yaml` to it so the artifact list is
# versioned. Keep the real API key in a masked CI/CD variable, not in the file.
# ==============================================================================

variables:
  # Inspection depth: L1 (fast), L2 (standard, recommended), L3 (deep)
  SANITYOPS_ACTION_CHECK_LEVEL: "L2"
  # Path to the artifact configuration, relative to the project root
  SANITYOPS_ACTION_CONFIG_PATH: ".sanityops/inspect_config.yaml"
  # Hard gate: fail the pipeline when any defect is found (default: soft gate)
  SANITYOPS_ACTION_FAIL_ON_DEFECT: "false"
  # Hard gate: fail the pipeline only when a P0 (blocker) defect is found
  SANITYOPS_ACTION_BLOCK_ON_P0: "false"
  # Optional LLM overrides (leave empty to use inspect_config.yaml)
  SANITYOPS_ACTION_PROVIDER: ""
  SANITYOPS_ACTION_MODEL_ID: ""
  SANITYOPS_ACTION_LLM_BASE_URL: ""
  # Execution timeout in seconds (default 1800) and agent token budget (default 200000)
  SANITYOPS_ACTION_TIMEOUT: ""
  SANITYOPS_ACTION_TOKEN_BUDGET: ""
  # CLI subcommand (default inspect)
  SANITYOPS_ACTION_COMMAND: "inspect"
  # Verbose console diagnostics
  SANITYOPS_ACTION_VERBOSE: "false"
  # Analyse artifacts but skip the LLM defect check
  SANITYOPS_ACTION_SKIP_DEFECT_CHECK: "false"
  # CLI release source and version
  SANITYOPS_ACTION_INSTALL_URL: "https://downloads.sanityops.org/sanityops-cli"
  SANITYOPS_ACTION_CLI_VERSION: "latest"
  # Runner tag (default: the shared docker runner)
  SANITYOPS_ACTION_RUNNER_TAG: "docker"
  # Dashboard upload (optional, off by default - see the README data handling section).
  # Setting an API key uploads scanned artifacts to the SanityOps server.
  SANITYOPS_ACTION_SERVER_API_KEY: ""
  SANITYOPS_ACTION_SERVER_BASE_URL: ""

sanityops-inspect:
  stage: test
  image: python:3.12
  tags:
    - "${SANITYOPS_ACTION_RUNNER_TAG}"
  before_script:
    # The official python:3.12 image already ships curl and git, so the prebuilt
    # CLI installs in seconds with no apt-get step.
    - curl -fsSL "${SANITYOPS_ACTION_INSTALL_URL}/install.sh" | bash -s -- --system --yes --version "${SANITYOPS_ACTION_CLI_VERSION}"
    - sanityops-cli --version
    - mkdir -p .sanityops/results .sanityops/logs .sanityops/repairs
    - touch .sanityops/results/.gitkeep .sanityops/logs/.gitkeep
    - |
    - |
      # The LLM settings reach the CLI through the environment. sanityops-cli prefers the
      # config file's `model:` section when it is complete, so the config is used as
      # written and never rewritten: injecting the secret into it would put a live key
      # into a git-tracked file in the workspace.
      export SANITYOPS_ACTION_CONFIG_PATH="${SANITYOPS_ACTION_CONFIG_PATH:-.sanityops/inspect_config.yaml}"
      if [ -n "${LLM_API_KEY:-}" ] || [ -n "${OPENAI_API_KEY:-}" ] || [ -n "${ANTHROPIC_API_KEY:-}" ]; then
        export LLM_API_KEY="${LLM_API_KEY:-${OPENAI_API_KEY:-${ANTHROPIC_API_KEY:-}}}"
      fi
      if [ -n "${SANITYOPS_ACTION_PROVIDER:-}" ]; then
        export LLM_PROVIDER="${SANITYOPS_ACTION_PROVIDER}"
      fi
      if [ -n "${SANITYOPS_ACTION_MODEL_ID:-}" ]; then
        export LLM_MODEL_ID="${SANITYOPS_ACTION_MODEL_ID}"
      fi
      if [ -n "${SANITYOPS_ACTION_LLM_BASE_URL:-}" ]; then
        export LLM_BASE_URL="${SANITYOPS_ACTION_LLM_BASE_URL}"
      fi
    - |
      # Dashboard upload is opt-in. Without an API key nothing leaves the runner.
      if [ -n "${SANITYOPS_ACTION_SERVER_API_KEY}" ]; then
        export SANITYOPS_API_KEY="${SANITYOPS_ACTION_SERVER_API_KEY}"
      fi
      if [ -n "${SANITYOPS_ACTION_SERVER_BASE_URL}" ]; then
        export SANITYOPS_BASE_URL="${SANITYOPS_ACTION_SERVER_BASE_URL}"
      fi
  script:
    - |
      SUBCOMMAND="${SANITYOPS_ACTION_COMMAND:-inspect}"
      CMD=("sanityops-cli" "$SUBCOMMAND")

      # Only an `inspect` run takes the inspect options and produces a report. Every
      # passthrough command (`--version`, `--help`) and every other subcommand
      # (`init`, `config`) must be invoked bare: appending --config/--check-level to
      # them makes the CLI reject the call with "No such option" and exit 2. The same
      # predicate decides whether the quality gate applies, since only `inspect`
      # writes a report to gate on.
      IS_INSPECT_RUN=false
      if [ "$SUBCOMMAND" = "inspect" ]; then
        IS_INSPECT_RUN=true
      fi

      # These options exist only on `inspect`.
      if [ "$IS_INSPECT_RUN" = "true" ]; then
        if [ -n "$SANITYOPS_ACTION_CONFIG_PATH" ]; then
          CMD+=("--config" "$SANITYOPS_ACTION_CONFIG_PATH")
        fi
        if [ -n "$SANITYOPS_ACTION_CHECK_LEVEL" ]; then
          CMD+=("--check-level" "$SANITYOPS_ACTION_CHECK_LEVEL")
        fi
        if [ "$SANITYOPS_ACTION_VERBOSE" = "true" ]; then
          CMD+=("--verbose")
        fi
        if [ "$SANITYOPS_ACTION_SKIP_DEFECT_CHECK" = "true" ]; then
          CMD+=("--skip-defect-check")
        fi
        if [ -n "$SANITYOPS_ACTION_TIMEOUT" ]; then
          CMD+=("--timeout" "$SANITYOPS_ACTION_TIMEOUT")
        fi
        if [ -n "$SANITYOPS_ACTION_TOKEN_BUDGET" ]; then
          CMD+=("--token-budget" "$SANITYOPS_ACTION_TOKEN_BUDGET")
        fi
      fi

      # Report which LLM settings are actually in effect. A config file carrying a
      # complete `model:` section wins over the environment, so a leftover placeholder
      # key there would be sent to the LLM; the check fails loudly instead.
      if [ "$IS_INSPECT_RUN" = "true" ]; then
        # --- BEGIN EMBED: check_llm_config ---
        export SANITYOPS_EMBED_CHECK_LLM_CONFIG=""
        # --- END EMBED: check_llm_config ---
        python3 -c "import base64, os, pathlib; pathlib.Path('/tmp/sanityops_check_llm_config.py').write_bytes(base64.b64decode(os.environ['SANITYOPS_EMBED_CHECK_LLM_CONFIG']))"
        # This script does not run under `set -e`, so a failing check aborts explicitly.
        python3 /tmp/sanityops_check_llm_config.py \
          --config "${SANITYOPS_ACTION_CONFIG_PATH:-.sanityops/inspect_config.yaml}" || exit 1
      fi

      echo "Running SanityOps inspection: ${CMD[*]}"
      set +e
      "${CMD[@]}"
      CLI_EXIT=$?
      set -e
      export SANITYOPS_GATE_CLI_EXIT="$CLI_EXIT"

      # The CLI logs to ~/.sanityops/logs, outside the workspace. Copy the logs in so
      # the job artifacts and the log-path output can find them.
      mkdir -p .sanityops/logs
      cp -R "${HOME}/.sanityops/logs/." .sanityops/logs/ 2>/dev/null || true

      if [ "$IS_INSPECT_RUN" = "true" ]; then
        # The CLI writes its report to <config-dir>/results/, so the report location
        # follows the config path. Deriving it beats searching the tree for
        # inspect-*.md, which also matches unrelated files such as fixtures.
        CONFIG_DIR="$(dirname "${SANITYOPS_ACTION_CONFIG_PATH:-.sanityops/inspect_config.yaml}")"
        if [ "$CONFIG_DIR" = "." ] || [ -z "$CONFIG_DIR" ]; then
          export SANITYOPS_ACTION_RESULTS_DIR="results"
        else
          export SANITYOPS_ACTION_RESULTS_DIR="${CONFIG_DIR}/results"
        fi

        # --- BEGIN EMBED: evaluate_gate ---
        export SANITYOPS_EMBED_EVALUATE_GATE=""
        # --- END EMBED: evaluate_gate ---
        python3 -c "import base64, os, pathlib; pathlib.Path('/tmp/sanityops_evaluate_gate.py').write_bytes(base64.b64decode(os.environ['SANITYOPS_EMBED_EVALUATE_GATE']))"
        python3 /tmp/sanityops_evaluate_gate.py
      else
        echo "[SanityOps Gate] Command '$SUBCOMMAND' does not produce an inspection report; the quality gate does not apply."
        exit "$CLI_EXIT"
      fi
  after_script:
    - |
      # Post or refresh the inspection report on the merge request. Full source:
      # scripts/post_mr_comment.py in the sanityops-action repository.
      if [ -n "$CI_MERGE_REQUEST_IID" ]; then
        # --- BEGIN EMBED: post_mr_comment ---
        export SANITYOPS_EMBED_POST_MR_COMMENT=""
        # --- END EMBED: post_mr_comment ---
        python3 -c "import base64, os, pathlib; pathlib.Path('/tmp/sanityops_post_mr_comment.py').write_bytes(base64.b64decode(os.environ['SANITYOPS_EMBED_POST_MR_COMMENT']))"
        python3 /tmp/sanityops_post_mr_comment.py || true
      fi
  artifacts:
    name: "sanityops-inspection-report-$CI_COMMIT_REF_SLUG"
    when: always
    expire_in: 1 week
    paths:
      - .sanityops/results/
      - .sanityops/logs/
  rules:
    # Hard gates turn off allow_failure so defects block the pipeline.
    - if: '($SANITYOPS_ACTION_FAIL_ON_DEFECT == "true" || $SANITYOPS_ACTION_BLOCK_ON_P0 == "true") && ($CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_PIPELINE_SOURCE == "web")'
      allow_failure: false
    # Default: soft gate (report the findings without blocking the merge).
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_PIPELINE_SOURCE == "web"'
      allow_failure: true
